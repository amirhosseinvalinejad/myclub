<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="titleLogin">Login</title>
    <link rel="stylesheet" href="/styles.css?v=nomenu" />
  </head>
  <body class="is-public login-page">
    <div class="date-bar">
      <time id="gregorian-date"></time>
      <span class="date-convert">
        <label for="calendar-select" data-i18n="convertLabel">Convert</label>
        <select id="calendar-select"></select>
      </span>
      <p id="converted-date"></p>
    </div>
    <div class="lang-picker">
      <label for="language-select" data-i18n="langLabel">Language</label>
      <select id="language-select"></select>
    </div>
    <div class="shell">
      <section class="panel auth-panel">
        <p class="tagline" data-i18n="account">Account</p>
        <h1 data-i18n="login">Login</h1>
        <form id="login-form" autocomplete="on">
          <label for="login-email" data-i18n="email">Email address</label>
          <input id="login-email" name="email" type="email" required maxlength="120" autocomplete="email" />
          <label for="login-password" data-i18n="password">Password</label>
          <input id="login-password" name="password" type="password" required minlength="6" autocomplete="current-password" />
          <p class="auth-extra"><a href="/forgot.html" data-i18n="forgotPassword">Forgot password?</a></p>
          <button type="submit" data-i18n="login">Login</button>
        </form>
        <p id="auth-status" class="status" role="status"></p>
        <p class="auth-back">
          <a href="/create.html" data-i18n="createAccount">Create account</a>
          ·
          <a href="/" data-i18n="backHome">Back to home</a>
        </p>
      </section>
    </div>
    <script src="/languages.js"></script>
    <script src="/i18n.js"></script>
    <script src="/calendars.js"></script>
    <script src="/chrome.js?v=highbury"></script>
    <script src="/auth.js"></script>
  </body>
</html>
