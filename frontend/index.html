<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arsenal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=brand" />
  </head>
  <body class="is-public landing-page">
    <div class="brand-stack">
      <time id="gregorian-date"></time>
      <a class="club-logo" href="/" aria-label="Arsenal">
        <img src="/logo-arsenal.png" alt="Arsenal" width="72" height="72" />
      </a>
    </div>
    <div class="lang-picker compact">
      <select id="language-select" aria-label="Language"></select>
    </div>
    <main class="hero-center">
      <div class="slogan-box">
        <h1 class="hero-copy">
          <span>Build Your Club</span>
          <span>Win Tournament</span>
          <span>Earn Cash Prizes</span>
        </h1>
      </div>
      <a class="login-btn" href="/login.html">Login</a>
    </main>
    <script src="/languages.js"></script>
    <script src="/i18n.js"></script>
    <script src="/calendars.js"></script>
    <script src="/chrome.js?v=brand"></script>
    <script>
      initChrome();
    </script>
  </body>
</html>
