<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="titleHome">MyClub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=glass5" />
  </head>
  <body class="is-public landing-page">
    <header class="glass-topbar">
      <div class="glass-topbar-cluster">
        <div class="date-strip" id="date-strip" role="list"></div>
        <div class="glass-topbar-lang">
          <label for="language-select" data-i18n="langLabel">Language</label>
          <select id="language-select" data-i18n="langLabel" data-i18n-attr="aria-label"></select>
        </div>
      </div>
    </header>
    <div class="brand-stack">
      <a class="club-logo" href="/" aria-label="Arsenal">
        <img src="/logo-arsenal.png" alt="Arsenal" width="92" height="92" />
      </a>
    </div>
    <main class="hero-center">
      <div class="slogan-box">
        <h1 class="hero-copy">
          <span data-i18n="heroBuild">Build Your Club</span>
          <span data-i18n="heroWin">Win Tournament</span>
          <span data-i18n="heroPrize">Earn Cash Prizes</span>
        </h1>
      </div>
      <a class="login-btn glass-login" href="/login.html" data-i18n="login">Login</a>
    </main>
    <script src="/languages.js"></script>
    <script src="/i18n.js?v=glass5"></script>
    <script src="/calendars.js"></script>
    <script src="/chrome.js?v=glass5"></script>
    <script>
      initChrome();
    </script>
  </body>
</html>
