<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="titleForgot">Forgot password</title>
    <link rel="stylesheet" href="/styles.css?v=glass5" />
  </head>
  <body class="is-public">
    <header class="glass-topbar">
      <div class="glass-topbar-cluster">
        <div class="date-strip" id="date-strip" role="list"></div>
        <div class="glass-topbar-lang">
          <label for="language-select" data-i18n="langLabel">Language</label>
          <select id="language-select" data-i18n="langLabel" data-i18n-attr="aria-label"></select>
        </div>
      </div>
    </header>
    <div class="shell">
      <section class="panel auth-panel">
        <p class="tagline" data-i18n="account">Account</p>
        <h1 data-i18n="forgotPassword">Forgot password</h1>
        <p class="lede" data-i18n="forgotLede">Enter your account email. We will send a link to set a new password.</p>
        <form id="forgot-form" autocomplete="on">
          <label for="forgot-email" data-i18n="email">Email address</label>
          <input id="forgot-email" name="email" type="email" required maxlength="120" autocomplete="email" />
          <button type="submit" data-i18n="sendReset">Send reset email</button>
        </form>
        <p id="auth-status" class="status" role="status"></p>
        <p id="mail-preview" class="auth-back" hidden>
          <a id="mail-preview-link" href="#" target="_blank" rel="noopener" data-i18n="openResetMail">Open the email to set a new password</a>
        </p>
        <p class="auth-back">
          <a href="/login.html" data-i18n="login">Login</a>
          ·
          <a href="/" data-i18n="backHome">Back to home</a>
        </p>
      </section>
    </div>
    <script src="/languages.js"></script>
    <script src="/i18n.js?v=glass5"></script>
    <script src="/calendars.js"></script>
    <script src="/chrome.js?v=glass5"></script>
    <script src="/auth.js?v=lang1"></script>
  </body>
</html>
