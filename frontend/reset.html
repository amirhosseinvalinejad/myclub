<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="titleReset">Set new password</title>
    <link rel="stylesheet" href="/styles.css?v=glass4" />
  </head>
  <body class="is-public">
    <header class="glass-topbar">
      <div class="glass-topbar-cluster">
        <div class="date-strip" id="date-strip" role="list"></div>
        <div class="glass-topbar-lang">
          <label for="language-select" data-i18n="langLabel">Language</label>
          <select id="language-select" data-i18n="langLabel" data-i18n-attr="aria-label"></select>
        </div>
      </div>
    </header>
    <div class="shell">
      <section class="panel auth-panel">
        <p class="tagline" data-i18n="account">Account</p>
        <h1 data-i18n="setNewPassword">Set a new password</h1>
        <p class="lede" data-i18n="resetLede">Choose a new password from the link we sent to your email.</p>
        <form id="reset-form" autocomplete="on">
          <label for="reset-password" data-i18n="createPassword">Create a password</label>
          <input id="reset-password" name="password" type="password" required minlength="8" autocomplete="new-password" />
          <p class="hint" data-i18n="passwordHint">Use letters, numbers, and a special character (at least 8 characters).</p>
          <label for="reset-confirm" data-i18n="confirmPassword">Confirm password</label>
          <input id="reset-confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password" />
          <button type="submit" data-i18n="saveNewPassword">Save new password</button>
        </form>
        <p id="auth-status" class="status" role="status"></p>
        <p class="auth-back">
          <a href="/login.html" data-i18n="login">Login</a>
          ·
          <a href="/" data-i18n="backHome">Back to home</a>
        </p>
      </section>
    </div>
    <script src="/languages.js"></script>
    <script src="/i18n.js?v=glass4"></script>
    <script src="/calendars.js"></script>
    <script src="/chrome.js?v=glass4"></script>
    <script src="/auth.js?v=lang1"></script>
  </body>
</html>
